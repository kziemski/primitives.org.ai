<!doctype html>
<!-- Source for site/public/og.png (1200×630). Rendered by headless Chrome:

       "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
         --headless=new --disable-gpu --hide-scrollbars \
         --screenshot=site/public/og.png --window-size=1200,630 \
         --allow-file-access-from-files "file://$PWD/site/og-card.html"

     The PNG is committed so an ordinary build never needs a browser.
     Layout mirrors foundation.org.ai's card (thin accent edge at left,
     wordmark, claim, domain) — one family, one shape.

     Palette: fumadocs' stock `neutral` preset (site/app/global.css), which
     is entirely achromatic. The one real colour in this repo is #C3E4F3,
     the fill of site/public/org-ai.svg — the mark the navbar actually
     renders — so that is the accent. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #121212;          /* --color-fd-background dark: 0 0% 7.04% */
    --fg: #ebebeb;          /* --color-fd-foreground dark: 0 0% 92%   */
    --accent: #c3e4f3;      /* org-ai.svg, the only brand colour here  */
    --muted: #b0b0b0;
    --dim: #7a7a7a;
    --line: rgba(255, 255, 255, 0.16);
    --sans: "Inter", ui-sans-serif, system-ui, -apple-system,
      BlinkMacSystemFont, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
      "Liberation Mono", "Courier New", monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--bg);
    font-family: var(--sans);
    color: var(--fg);
    position: relative;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .edge {
    position: absolute; left: 96px; top: 96px; bottom: 96px;
    width: 6px; background: var(--accent);
  }
  .in {
    position: absolute; left: 150px; right: 96px; top: 96px; bottom: 96px;
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .wordmark {
    font-size: 30px; font-weight: 600; letter-spacing: -0.01em;
    color: var(--muted);
  }
  .body { display: flex; flex-direction: column; gap: 26px; }
  .claim {
    font-size: 56px; font-weight: 650; line-height: 1.14;
    letter-spacing: -0.03em; color: var(--fg); max-width: 950px;
  }
  .claim em { font-style: normal; color: var(--accent); }
  .sub {
    font-size: 26px; font-weight: 400; line-height: 1.44;
    color: var(--dim); max-width: 900px;
  }
  .foot { display: flex; flex-direction: column; gap: 20px; }
  .site { font-size: 26px; font-weight: 400; color: var(--muted); }
  .set {
    font: 400 16px/1 var(--mono);
    letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim);
  }
  .set span { color: var(--line); padding: 0 6px; }
</style>
</head>
<body>
  <div class="edge"></div>
  <div class="in">
    <div class="wordmark">Primitives.org.ai</div>
    <div class="body">
      <div class="claim">Build <em>Business-as-Code</em><br>&amp; AI-Delivered <em>Services-as-Software</em>.</div>
      <div class="sub">The fundamental abstractions for building AI-native software — from Functions and Agents through Services and Businesses.</div>
    </div>
    <div class="foot">
      <div class="set">Function<span>/</span>Database<span>/</span>Workflow<span>/</span>Task<span>/</span>Agent<span>/</span>Human<span>/</span>Product<span>/</span>Service<span>/</span>Business</div>
      <div class="site">primitives.org.ai</div>
    </div>
  </div>
</body>
</html>
